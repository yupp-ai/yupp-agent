name: 'Authenticate to GCP'
description: 'Authenticates to Google Cloud and sets up gcloud SDK if not already done'
inputs:
  gcp_project_id:
    description: 'GCP Project ID'
    required: true
  credentials_json:
    description: 'GCP Service Account Key JSON'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Check if already authenticated
      id: check-auth
      shell: bash
      run: |
        # Check if gcloud is already configured and authenticated
        if command -v gcloud &> /dev/null && \
           [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]] && \
           [[ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]] && \
           gcloud auth list --filter=status:ACTIVE --format="value(account)" 2>/dev/null | grep -q .; then
          echo "already_authenticated=true" >> $GITHUB_OUTPUT
          echo "✅ Already authenticated to GCP, skipping authentication"
        else
          echo "already_authenticated=false" >> $GITHUB_OUTPUT
          echo "🔐 Need to authenticate to GCP"
        fi

    - name: Authenticate to Google Cloud
      if: steps.check-auth.outputs.already_authenticated != 'true'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - name: Set up Cloud SDK
      if: steps.check-auth.outputs.already_authenticated != 'true'
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.gcp_project_id }}
        skip_install: true
