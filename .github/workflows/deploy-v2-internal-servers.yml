  deploy-ahs:
    runs-on: ubuntu-latest
    needs: [print-and-validate-inputs]
    if: ${{ always() && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_ahs == 'true' || inputs.deploy_ahs)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=agent-harness-service" >> $GITHUB_ENV
        # gcloud compute ssh/scp requires project ID (string), not project number.
        echo "GCP_PROJECT_NAME=yupp-llms" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "VM_NAME=agent-harness-service-prod" >> $GITHUB_ENV
          echo "VM_ZONE=us-east5-a" >> $GITHUB_ENV
        else
          echo "VM_NAME=agent-harness-service" >> $GITHUB_ENV
          echo "VM_ZONE=us-east5-c" >> $GITHUB_ENV
        fi

    - name: Print AHS deploy info
      run: |
        {
          echo "## AHS Deployment"
          echo "| Setting | Value |"
          echo "|---------|-------|"
          echo "| Environment | ${{ env.ENVIRONMENT }} |"
          echo "| VM | ${{ env.VM_NAME }} (${{ env.VM_ZONE }}) |"
          echo "| Git Branch | ${{ env.GIT_BRANCH }} |"
          echo "| Git SHA | ${{ env.BUILD_GIT_SHA }} |"
        } >> $GITHUB_STEP_SUMMARY

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate .env file
      run: |
        pip install google-cloud-secret-manager PyYAML pydantic
        PYTHONPATH="${GITHUB_WORKSPACE}" python .github/workflows/scripts/generate_vm_env_file.py \
          "${{ env.ENVIRONMENT }}" \
          "${{ env.SERVICE_NAME }}" \
          /tmp/ahs.env

    - name: Deploy to VM
      run: |
        # Copy .env to VM
        gcloud compute scp /tmp/ahs.env \
          "${{ env.VM_NAME }}:/tmp/ahs.env" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}"

        # Move .env into place, checkout the target ref, sync configs, and restart.
        # We do git fetch+checkout before calling sync_configs.sh because the VM's
        # existing script may not support --ref yet (bootstrap problem).
        gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="sudo cp /tmp/ahs.env /data/ahs/.env && sudo chown ahs:ahs /data/ahs/.env && sudo chmod 600 /data/ahs/.env && rm -f /tmp/ahs.env && cd /opt/yupp-mind && sudo -u ahs git fetch origin && sudo -u ahs git checkout --force ${{ env.BUILD_GIT_SHA }} && sudo -u ahs /opt/yupp-mind/ypl/agent_harness_service/deploy/sync_configs.sh --no-pull && sudo systemctl restart ahs && echo 'AHS deployed and restarted successfully'"

    - name: Verify AHS is running
      run: |
        sleep 5
        STATUS=$(gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="sudo systemctl is-active ahs" 2>&1) || true

        COMMIT=$(gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="cd /opt/yupp-mind && git rev-parse --short HEAD" 2>&1) || true

        {
          echo "### AHS Health Check"
          echo "| Check | Result |"
          echo "|-------|--------|"
          echo "| systemctl status | \`${STATUS}\` |"
          echo "| VM commit | \`${COMMIT}\` |"
          echo "| Expected commit | \`${{ env.BUILD_GIT_SHA }}\` |"
        } >> $GITHUB_STEP_SUMMARY

        if [ "$STATUS" != "active" ]; then
          echo "::error::AHS is not running after deploy (status: ${STATUS})"
          # Grab recent journal logs for debugging
          gcloud compute ssh "${{ env.VM_NAME }}" \
            --zone="${{ env.VM_ZONE }}" \
            --project="${{ env.GCP_PROJECT_NAME }}" \
            --command="sudo journalctl -u ahs --no-pager -n 30" 2>&1 || true
          exit 1
        fi
        echo "AHS is running (commit: ${COMMIT})"

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ env.BUILD_GIT_SHA }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New Agent Harness Service (AHS) version deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "New Agent Harness Service (AHS) version deployed to production"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
