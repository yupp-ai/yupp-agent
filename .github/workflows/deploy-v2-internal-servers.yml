name: Deploy Internal Servers
# Deploy internal services (Admin, Discord, Streamlit, Slack Interaction, MCP Server, MCP OAuth, SAG, AHS) individually or all at once.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: string
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'v2-latest'
        type: string
      git_sha:
        description: 'Git SHA for Cloud Run revision labels'
        required: false
        type: string
        default: ''
      release_request_key:
        description: 'Release key. When set, individual Slack success posts are suppressed.'
        required: false
        type: string
        default: ''
      deploy_all:
        description: 'Deploy all internal services'
        required: false
        type: boolean
        default: false
      deploy_admin_service:
        description: 'Deploy Admin Service'
        required: false
        type: boolean
        default: false
      deploy_discord_service:
        description: 'Deploy Discord Service'
        required: false
        type: boolean
        default: false
      deploy_streamlit_server:
        description: 'Deploy Streamlit Server'
        required: false
        type: boolean
        default: false
      deploy_slack_interaction_server:
        description: 'Deploy Slack Interaction Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server:
        description: 'Deploy MCP Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server_oauth:
        description: 'Deploy MCP Server OAuth'
        required: false
        type: boolean
        default: false
      deploy_slack_agent_gateway:
        description: 'Deploy Slack Agent Gateway (SAG)'
        required: false
        type: boolean
        default: false
      deploy_ahs:
        description: 'Deploy Agent Harness Service (AHS)'
        required: false
        type: boolean
        default: false
      skip_build:
        description: 'Skip the build step (set to true when called from a parent workflow that already built the image)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'v2-latest'
        type: choice
        options:
        - v2-latest
        - release-candidate
        - cherry-pick-release-candidate
      deploy_all:
        description: 'Deploy all internal services (overrides individual selections)'
        required: false
        type: boolean
        default: false
      deploy_admin_service:
        description: 'Deploy Admin Service'
        required: false
        type: boolean
        default: false
      deploy_discord_service:
        description: 'Deploy Discord Service'
        required: false
        type: boolean
        default: false
      deploy_streamlit_server:
        description: 'Deploy Streamlit Server'
        required: false
        type: boolean
        default: false
      deploy_slack_interaction_server:
        description: 'Deploy Slack Interaction Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server:
        description: 'Deploy MCP Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server_oauth:
        description: 'Deploy MCP Server OAuth'
        required: false
        type: boolean
        default: false
      deploy_slack_agent_gateway:
        description: 'Deploy Slack Agent Gateway (SAG)'
        required: false
        type: boolean
        default: false
      deploy_ahs:
        description: 'Deploy Agent Harness Service (AHS)'
        required: false
        type: boolean
        default: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || inputs.environment || 'staging' }}
  GCP_REGION: 'us-east4'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: "gcr.io/yupp-llms/backend:${{ github.event.inputs.image_tag || inputs.image_tag || 'v2-latest' }}"
  IMAGE_TAG: ${{ github.event.inputs.image_tag || inputs.image_tag || 'v2-latest' }}
  REGION: 'us-east4'
  GIT_BRANCH: ${{ github.ref_name }}
  BUILD_GIT_SHA: ${{ inputs.git_sha || github.sha }}
  RELEASE_REQUEST_KEY: ${{ inputs.release_request_key || '' }}

permissions:
  contents: write
  packages: read

jobs:
  # Build the Docker image first when triggered directly via workflow_dispatch with v2-latest tag
  # and targeting staging environment.
  # When called via workflow_call, the caller is responsible for building the image.
  # When using non-default tags (release-candidate, cherry-pick-release-candidate), the image
  # should already exist from a previous build workflow.
  # We explicitly check for staging to prevent building on invalid production attempts (which would
  # fail validation anyway, but we don't want to mutate v2-latest in that case).
  # Note: AHS is VM-based and doesn't need a Docker image, but this build runs anyway
  # since GitHub Actions can't dynamically check which downstream jobs need it.
  # Note: We check !inputs.skip_build to allow parent workflows to skip the build step when they've
  # already built the image. This is necessary because github.event_name retains the original trigger
  # type (e.g., workflow_dispatch) even in nested reusable workflows.
  build-image:
    if: ${{ !inputs.skip_build && github.event_name == 'workflow_dispatch' && (github.event.inputs.image_tag == 'v2-latest' || github.event.inputs.image_tag == '') && github.event.inputs.environment != 'production' }}
    uses: ./.github/workflows/deploy-v2-build-only.yml
    with:
      deployment_type: 'create normal staging candidate'
    secrets: inherit

  print-and-validate-inputs:
    runs-on: ubuntu-latest
    needs: [build-image]
    # Always run this job, but wait for build-image if it ran
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') }}
    steps:
      - name: Print Workflow Inputs
        run: |
          {
            echo "## Internal Servers Deployment Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Git Branch | ${{ env.GIT_BRANCH }} |"
            echo "| Git SHA | ${{ env.BUILD_GIT_SHA }} |"
            echo "| Image Tag | ${{ env.IMAGE_TAG }} |"
            echo "| Deploy All | ${{ github.event.inputs.deploy_all || inputs.deploy_all || 'false' }} |"
            echo "| Deploy Admin Service | ${{ github.event.inputs.deploy_admin_service || inputs.deploy_admin_service || 'false' }} |"
            echo "| Deploy Discord Service | ${{ github.event.inputs.deploy_discord_service || inputs.deploy_discord_service || 'false' }} |"
            echo "| Deploy Streamlit Server | ${{ github.event.inputs.deploy_streamlit_server || inputs.deploy_streamlit_server || 'false' }} |"
            echo "| Deploy Slack Interaction Server | ${{ github.event.inputs.deploy_slack_interaction_server || inputs.deploy_slack_interaction_server || 'false' }} |"
            echo "| Deploy MCP Server | ${{ github.event.inputs.deploy_mcp_server || inputs.deploy_mcp_server || 'false' }} |"
            echo "| Deploy MCP Server OAuth | ${{ github.event.inputs.deploy_mcp_server_oauth || inputs.deploy_mcp_server_oauth || 'false' }} |"
            echo "| Deploy Slack Agent Gateway (SAG) | ${{ github.event.inputs.deploy_slack_agent_gateway || inputs.deploy_slack_agent_gateway || 'false' }} |"
            echo "| Deploy Agent Harness Service (AHS) | ${{ github.event.inputs.deploy_ahs || inputs.deploy_ahs || 'false' }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Validate inputs
        # Only validate for workflow_dispatch (direct invocation). When called via workflow_call,
        # the caller (deploy-v2-deploy-only.yml) is responsible for validation.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Current git branch: ${{ env.GIT_BRANCH }}"

          # Check if trying to deploy to production from main branch
          if [[ "$ENVIRONMENT" == "production" && "$GIT_BRANCH" == "main" ]]; then
            echo "❌ ERROR: Cannot deploy to production from main branch"
            echo "Please use the production-release-candidate tag (or the cherry pick branch/tag if this is a cherry-pick release)"
            exit 1
          fi

          # Check if trying to deploy v2-latest tag to production
          if [[ "$ENVIRONMENT" == "production" && "$IMAGE_TAG" == "v2-latest" ]]; then
            echo "❌ ERROR: Cannot deploy v2-latest tag to production"
            echo "Please build a release-candidate or cherry-pick-release-candidate and deploy it to production"
            exit 1
          fi

          # Check if trying to deploy production-cherry-pick-release branch to production
          if [[ "$ENVIRONMENT" == "production" && "$GIT_BRANCH" == "production-cherry-pick-release" ]]; then
            echo "❌ ERROR: Cannot deploy production-cherry-pick-release branch to production"
            echo "Please use the branch where you built the cherry-pick release candidate"
            exit 1
          fi

  deploy-slack-interaction-server:
    runs-on: ubuntu-latest
    needs: [build-image, print-and-validate-inputs]
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_slack_interaction_server == 'true' || inputs.deploy_slack_interaction_server)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=slack-interaction-server" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=slack-interaction-server-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=slack-interaction-server-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=4Gi" >> $GITHUB_ENV
        echo "CPU=1" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy secrets string
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/backend/llm/model/slack_interaction_server_entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New slack interaction server version deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "New slack interaction server version deployed to production"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-streamlit-server:
    runs-on: ubuntu-latest
    needs: [build-image, print-and-validate-inputs]
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_streamlit_server == 'true' || inputs.deploy_streamlit_server)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=streamlit-server" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=streamlit-server-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=streamlit-server-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=32Gi" >> $GITHUB_ENV
        echo "CPU=8" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy secrets string
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/streamlit_server/streamlit_server_entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New streamlit server version deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "New streamlit server version deployed to production"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-discord-service:
    runs-on: ubuntu-latest
    needs: [build-image, print-and-validate-inputs]
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_discord_service == 'true' || inputs.deploy_discord_service)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=discord-service" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=discord-service-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=discord-service-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=4Gi" >> $GITHUB_ENV
        echo "CPU=1" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy outputs
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --vpc-egress=private-ranges-only \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/discord_service/server/entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New discord service version deployed to production",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "New discord service version deployed to production"
                }
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-admin-service:
    runs-on: ubuntu-latest
    needs: [build-image, print-and-validate-inputs]
    if: ${{ always() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_admin_service == 'true' || inputs.deploy_admin_service)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=admin-service" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=admin-service-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=admin-service-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=8Gi" >> $GITHUB_ENV
        echo "CPU=2" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy outputs
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        # Admin service uses the same secrets as the backend service.
        service: "backend"

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
