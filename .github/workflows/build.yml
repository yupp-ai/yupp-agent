name: Build and Push Docker Image
# Build the agent-backend Docker image and push to GCR.

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag (e.g. latest, release-candidate)'
        required: false
        type: string
        default: 'latest'
      rebuild_base:
        description: 'Rebuild base image (only needed when dependencies change)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag'
        required: true
        default: 'latest'
        type: choice
        options:
        - latest
        - release-candidate
      rebuild_base:
        description: 'Rebuild base image (only needed when dependencies change)'
        required: false
        type: boolean
        default: false

env:
  IMAGE_BASE: gcr.io/yupp-llms/agent-backend
  BASE_IMAGE: gcr.io/yupp-llms/agent-base-py312:latest
  IMAGE_TAG: ${{ github.event.inputs.image_tag || inputs.image_tag || 'latest' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

permissions:
  contents: read
  packages: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push base image
      if: ${{ github.event.inputs.rebuild_base == 'true' || inputs.rebuild_base }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.base
        platforms: linux/amd64
        push: true
        tags: ${{ env.BASE_IMAGE }}
        cache-from: type=gha,scope=base
        cache-to: type=gha,scope=base,mode=max

    - name: Generate build metadata
      run: |
        echo "BUILD_GIT_SHA=${{ github.sha }}" >> .env
        echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env
        echo "BUILD_GIT_BRANCH=${{ github.ref_name }}" >> .env

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
          ${{ env.IMAGE_BASE }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=app
        cache-to: type=gha,scope=app,mode=max

    - name: Print image info
      run: |
        {
          echo "## Docker Image Built"
          echo "| Setting | Value |"
          echo "|---------|-------|"
          echo "| Image | \`${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}\` |"
          echo "| SHA tag | \`${{ env.IMAGE_BASE }}:sha-${{ github.sha }}\` |"
          echo "| Git SHA | \`${{ github.sha }}\` |"
        } >> $GITHUB_STEP_SUMMARY
