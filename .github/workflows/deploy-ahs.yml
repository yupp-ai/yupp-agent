name: Deploy AHS
# Deploy Agent Harness Service to VM (no Docker build needed).

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: string
      git_sha:
        description: 'Git SHA to deploy'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || inputs.environment || 'staging' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GIT_BRANCH: ${{ github.ref_name }}
  BUILD_GIT_SHA: ${{ inputs.git_sha || github.sha }}

permissions:
  contents: write
  packages: read

jobs:
  deploy-ahs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate inputs
      if: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        if [[ "$ENVIRONMENT" == "production" && "${{ env.GIT_BRANCH }}" == "main" ]]; then
          echo "❌ ERROR: Cannot deploy to production from main branch"
          exit 1
        fi

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=agent-harness-service" >> $GITHUB_ENV
        echo "GCP_PROJECT_NAME=yupp-llms" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "VM_NAME=agent-harness-service-prod" >> $GITHUB_ENV
          echo "VM_ZONE=us-east5-a" >> $GITHUB_ENV
        else
          echo "VM_NAME=agent-harness-service" >> $GITHUB_ENV
          echo "VM_ZONE=us-east5-c" >> $GITHUB_ENV
        fi

    - name: Print AHS deploy info
      run: |
        {
          echo "## AHS Deployment"
          echo "| Setting | Value |"
          echo "|---------|-------|"
          echo "| Environment | ${{ env.ENVIRONMENT }} |"
          echo "| VM | ${{ env.VM_NAME }} (${{ env.VM_ZONE }}) |"
          echo "| Git Branch | ${{ env.GIT_BRANCH }} |"
          echo "| Git SHA | ${{ env.BUILD_GIT_SHA }} |"
        } >> $GITHUB_STEP_SUMMARY

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate .env file
      run: |
        pip install google-cloud-secret-manager PyYAML pydantic
        PYTHONPATH="${GITHUB_WORKSPACE}" python .github/workflows/scripts/generate_vm_env_file.py \
          "${{ env.ENVIRONMENT }}" \
          "${{ env.SERVICE_NAME }}" \
          /tmp/ahs.env

    - name: Deploy to VM
      run: |
        gcloud compute scp /tmp/ahs.env \
          "${{ env.VM_NAME }}:/tmp/ahs.env" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}"

        gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="sudo cp /tmp/ahs.env /data/ahs/.env && sudo chown ahs:ahs /data/ahs/.env && sudo chmod 600 /data/ahs/.env && rm -f /tmp/ahs.env && cd /opt/yupp-agent && sudo -u ahs git fetch origin && sudo -u ahs git checkout --force ${{ env.BUILD_GIT_SHA }} && sudo -u ahs /opt/yupp-agent/ypl/agent_harness_service/deploy/sync_configs.sh --no-pull && sudo systemctl restart ahs && echo 'AHS deployed and restarted successfully'"

    - name: Verify AHS is running
      run: |
        sleep 10
        COMMIT=$(gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="cd /opt/yupp-agent && git rev-parse --short HEAD" 2>&1) || true

        # Hit the actual HTTP health endpoint (retries for up to 30s)
        HEALTH=""
        for i in $(seq 1 6); do
          HEALTH=$(gcloud compute ssh "${{ env.VM_NAME }}" \
            --zone="${{ env.VM_ZONE }}" \
            --project="${{ env.GCP_PROJECT_NAME }}" \
            --command="curl -sf http://localhost:8090/health 2>/dev/null" 2>&1) && break
          echo "Health check attempt $i failed, retrying in 5s..."
          sleep 5
        done

        STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")

        {
          echo "### AHS Health Check"
          echo "| Check | Result |"
          echo "|-------|--------|"
          echo "| /health status | \`${STATUS}\` |"
          echo "| /health response | \`${HEALTH}\` |"
          echo "| VM commit | \`${COMMIT}\` |"
          echo "| Expected commit | \`${{ env.BUILD_GIT_SHA }}\` |"
        } >> $GITHUB_STEP_SUMMARY

        if [ "$STATUS" != "ok" ]; then
          echo "::error::AHS health check failed (status: ${STATUS})"
          gcloud compute ssh "${{ env.VM_NAME }}" \
            --zone="${{ env.VM_ZONE }}" \
            --project="${{ env.GCP_PROJECT_NAME }}" \
            --command="sudo journalctl -u ahs --no-pager -n 50" 2>&1 || true
          exit 1
        fi
        echo "AHS is healthy (commit: ${COMMIT})"

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ env.BUILD_GIT_SHA }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production'
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New AHS (yupp-agent) deployed to production",
            "blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "New AHS (yupp-agent) deployed to production"}}]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
