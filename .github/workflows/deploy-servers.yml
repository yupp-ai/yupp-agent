name: Deploy Servers
# Deploy Cloud Run services (MCP Server, MCP OAuth, SAG, Streamlit). AHS is in deploy-ahs.yml (VM-based, no Docker).

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: string
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'
        type: string
      git_sha:
        description: 'Git SHA for Cloud Run revision labels'
        required: false
        type: string
        default: ''
      release_request_key:
        description: 'Release key. When set, individual Slack success posts are suppressed.'
        required: false
        type: string
        default: ''
      deploy_all:
        description: 'Deploy all agent services'
        required: false
        type: boolean
        default: false
      deploy_mcp_server:
        description: 'Deploy MCP Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server_oauth:
        description: 'Deploy MCP Server OAuth'
        required: false
        type: boolean
        default: false
      deploy_slack_agent_gateway:
        description: 'Deploy Slack Agent Gateway (SAG)'
        required: false
        type: boolean
        default: false
      deploy_streamlit_server:
        description: 'Deploy Streamlit Server'
        required: false
        type: boolean
        default: false
      skip_build:
        description: 'Skip the build step'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Image tag to deploy'
        required: true
        default: 'latest'
        type: choice
        options:
        - latest
        - release-candidate
        - cherry-pick-release-candidate
      deploy_all:
        description: 'Deploy all agent services (overrides individual selections)'
        required: false
        type: boolean
        default: false
      deploy_mcp_server:
        description: 'Deploy MCP Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server_oauth:
        description: 'Deploy MCP Server OAuth'
        required: false
        type: boolean
        default: false
      deploy_slack_agent_gateway:
        description: 'Deploy Slack Agent Gateway (SAG)'
        required: false
        type: boolean
        default: false
      deploy_streamlit_server:
        description: 'Deploy Streamlit Server'
        required: false
        type: boolean
        default: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || inputs.environment || 'staging' }}
  GCP_REGION: 'us-east4'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE_NAME: "gcr.io/yupp-llms/agent-backend:${{ github.event.inputs.image_tag || inputs.image_tag || 'latest' }}"
  IMAGE_TAG: ${{ github.event.inputs.image_tag || inputs.image_tag || 'latest' }}
  REGION: 'us-east4'
  GIT_BRANCH: ${{ github.ref_name }}
  BUILD_GIT_SHA: ${{ inputs.git_sha || github.sha }}
  RELEASE_REQUEST_KEY: ${{ inputs.release_request_key || '' }}

permissions:
  contents: write
  packages: read

jobs:
  print-and-validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Print Workflow Inputs
        run: |
          {
            echo "## Agent Services Deployment Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Environment | ${{ env.ENVIRONMENT }} |"
            echo "| Git Branch | ${{ env.GIT_BRANCH }} |"
            echo "| Git SHA | ${{ env.BUILD_GIT_SHA }} |"
            echo "| Image Tag | ${{ env.IMAGE_TAG }} |"
            echo "| Deploy All | ${{ github.event.inputs.deploy_all || inputs.deploy_all || 'false' }} |"
            echo "| Deploy MCP Server | ${{ github.event.inputs.deploy_mcp_server || inputs.deploy_mcp_server || 'false' }} |"
            echo "| Deploy MCP Server OAuth | ${{ github.event.inputs.deploy_mcp_server_oauth || inputs.deploy_mcp_server_oauth || 'false' }} |"
            echo "| Deploy Slack Agent Gateway (SAG) | ${{ github.event.inputs.deploy_slack_agent_gateway || inputs.deploy_slack_agent_gateway || 'false' }} |"
            echo "| Deploy Streamlit Server | ${{ github.event.inputs.deploy_streamlit_server || inputs.deploy_streamlit_server || 'false' }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Validate inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Current git branch: ${{ env.GIT_BRANCH }}"

          if [[ "$ENVIRONMENT" == "production" && "$GIT_BRANCH" == "main" ]]; then
            echo "❌ ERROR: Cannot deploy to production from main branch"
            echo "Please use a release-candidate tag"
            exit 1
          fi

          if [[ "$ENVIRONMENT" == "production" && "$IMAGE_TAG" == "v2-latest" ]]; then
            echo "❌ ERROR: Cannot deploy v2-latest tag to production"
            exit 1
          fi

  deploy-mcp-server:
    runs-on: ubuntu-latest
    needs: [print-and-validate-inputs]
    if: ${{ always() && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_mcp_server == 'true' || inputs.deploy_mcp_server)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=mcp-server" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-mcp-server-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-mcp-server-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=2Gi" >> $GITHUB_ENV
        echo "CPU=1" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy outputs
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "MCP_SERVER_BASE_URL: https://yuppster-mcp.yupp.ai" >> .env.yml
        else
          echo "MCP_SERVER_BASE_URL: https://yuppster-mcp-staging.yupp.ai" >> .env.yml
        fi

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/mcp_server/entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New MCP server (yupp-agent) deployed to production",
            "blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "New MCP server (yupp-agent) deployed to production"}}]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-mcp-server-oauth:
    runs-on: ubuntu-latest
    needs: [print-and-validate-inputs]
    if: ${{ always() && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_mcp_server_oauth == 'true' || inputs.deploy_mcp_server_oauth)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=mcp-server" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-mcp-server-oauth-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
          echo "MCP_SERVER_BASE_URL=https://yuppster-mcp-oauth.yupp.ai" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-mcp-server-oauth-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
          echo "MCP_SERVER_BASE_URL=https://yuppster-mcp-oauth-staging.yupp.ai" >> $GITHUB_ENV
        fi
        echo "MEMORY=2Gi" >> $GITHUB_ENV
        echo "CPU=1" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy outputs
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml
        echo "MCP_SERVER_MODE: OAUTH" >> .env.yml
        echo "MCP_SERVER_BASE_URL: ${{ env.MCP_SERVER_BASE_URL }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/mcp_server/entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-mcp-server-oauth-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

  deploy-slack-agent-gateway:
    runs-on: ubuntu-latest
    needs: [print-and-validate-inputs]
    if: ${{ always() && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_slack_agent_gateway == 'true' || inputs.deploy_slack_agent_gateway)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=slack-agent-gateway" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-slack-gateway-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-slack-gateway-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=2Gi" >> $GITHUB_ENV
        echo "CPU=1" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy secrets string
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --service-account=slack-agent-gateway@yupp-llms.iam.gserviceaccount.com \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/slack_agent_gateway/entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force

    - name: Post to Slack for Production Deployment
      if: env.ENVIRONMENT == 'production' && env.RELEASE_REQUEST_KEY == ''
      continue-on-error: true
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "New Slack Agent Gateway (yupp-agent) deployed to production",
            "blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "New Slack Agent Gateway (yupp-agent) deployed to production"}}]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GG_PUSH_PRODUCTION }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-streamlit-server:
    runs-on: ubuntu-latest
    needs: [print-and-validate-inputs]
    if: ${{ always() && needs.print-and-validate-inputs.result == 'success' && ((github.event.inputs.deploy_all == 'true' || inputs.deploy_all) || (github.event.inputs.deploy_streamlit_server == 'true' || inputs.deploy_streamlit_server)) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=streamlit-server" >> $GITHUB_ENV
        if [[ "${{ env.ENVIRONMENT }}" == "production" ]]; then
          echo "ENVIRONMENT=production" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-streamlit-server-production" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_PRODUCTION_READ_REPLICA }}" >> $GITHUB_ENV
        else
          echo "ENVIRONMENT=staging" >> $GITHUB_ENV
          echo "CLOUD_RUN_SERVICE_NAME=agent-streamlit-server-staging" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING }}" >> $GITHUB_ENV
          echo "CLOUD_SQL_CONNECTION_NAME_READ_REPLICA=${{ secrets.CLOUD_SQL_CONNECTION_NAME_STAGING_READ_REPLICA }}" >> $GITHUB_ENV
        fi
        echo "MEMORY=4Gi" >> $GITHUB_ENV
        echo "CPU=2" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate gcloud deploy secrets string
      id: generate_gcloud_deploy_outputs
      uses: ./.github/actions/generate-gcloud-deploy-secrets-string
      with:
        environment: ${{ env.ENVIRONMENT }}
        service: ${{ env.SERVICE_NAME }}

    - name: Create the .env and .env.yml files
      run: |
        echo "ENVIRONMENT=${{ env.ENVIRONMENT }}" >> .env
        echo "${{ steps.generate_gcloud_deploy_outputs.outputs.deploy_env_yaml }}" >> .env.yml

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --image ${{ env.IMAGE_NAME }} \
          --platform managed \
          --region ${{ env.REGION }} \
          --labels=build_git_sha=${{ env.BUILD_GIT_SHA }} \
          --env-vars-file=.env.yml \
          --allow-unauthenticated \
          --cpu ${{ env.CPU }} \
          --memory ${{ env.MEMORY }} \
          --args=service \
          --network=default \
          --timeout=10m \
          --set-cloudsql-instances=${{ env.CLOUD_SQL_CONNECTION_NAME }},${{ env.CLOUD_SQL_CONNECTION_NAME_READ_REPLICA }} \
          --set-secrets="${{ steps.generate_gcloud_deploy_outputs.outputs.secrets_string }}" \
          --command="/app/ypl/streamlit_server/entrypoint.sh"

    - name: Update traffic to latest version
      run: |
        gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE_NAME }} \
          --to-latest \
          --region ${{ env.REGION }} \
          --platform managed

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-${{ env.ENVIRONMENT }}
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force
