name: Lint and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      has_python_changes: ${{ steps.filter.outputs.has_python_changes }}
      has_db_changes: ${{ steps.filter.outputs.has_db_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            has_python_changes:
              - '**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
            has_db_changes:
              - 'ypl/db/**'
              - 'alembic.ini'

  lint:
    needs: changes
    if: needs.changes.outputs.has_python_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-test-runner

      - name: Run lint
        run: |
          poetry run ruff check . --output-format=github
          poetry run ruff format . --check

  mypy:
    needs: changes
    if: needs.changes.outputs.has_python_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-test-runner

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-v2-${{ hashFiles('pyproject.toml') }}-
            mypy-v2-

      - name: Run mypy
        run: poetry run mypy --config-file=pyproject.toml .

  test:
    needs: changes
    if: needs.changes.outputs.has_python_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-test-runner

      - name: Create env file for tests
        run: cp .env.test .env

      - name: Run tests with coverage
        env:
          ENVIRONMENT: test
        run: poetry run pytest -m 'not alembic' --timeout=120 --cov --cov-report=term-missing --cov-fail-under=50 || [ $? -eq 5 ]

  test-alembic:
    needs: changes
    if: needs.changes.outputs.has_db_changes == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_yadb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-test-runner

      - name: Create env file for tests
        run: cp .env.test .env

      - name: Run alembic tests
        env:
          ENVIRONMENT: test
          ALEMBIC_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/test_yadb
        run: |
          if [ -f tests/conftest.py ]; then
            poetry run pytest --test-alembic tests/conftest.py tests/alembic/test_db_datetime_timezone.py
          else
            echo "No alembic tests found, skipping"
          fi

  lint-and-test:
    needs: [lint, mypy, test, test-alembic]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Successful deploy
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing deploy
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
