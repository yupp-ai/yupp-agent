name: "Deploy Servers 1 - Build & Staging"
run-name: >-
  Staging: ${{ github.event_name == 'push'
    && format('PR - {0}', github.event.head_commit.message)
    || format('{0} - {1}',
        github.event.inputs.deployment_type,
        github.event.inputs.deploy_all == 'true' && 'all services'
        || format('{0}{1}{2}{3}{4}',
          github.event.inputs.deploy_mcp_server == 'true' && 'mcp ' || '',
          github.event.inputs.deploy_mcp_server_oauth == 'true' && 'mcp-oauth ' || '',
          github.event.inputs.deploy_slack_agent_gateway == 'true' && 'sag ' || '',
          github.event.inputs.deploy_streamlit_server == 'true' && 'streamlit ' || '',
          github.event.inputs.deploy_ahs == 'true' && 'ahs' || ''
        )
      )
  }}
# Build the Docker image and deploy to staging. To deploy to production, use "Deploy Servers 2 - Production".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Select the deployment type'
        required: true
        type: choice
        default: 'normal staging deployment'
        options:
        - normal staging deployment
        - create staging release candidate
        - create cherry-pick release candidate
      deploy_all:
        description: 'Deploy all services to staging'
        required: true
        type: boolean
        default: true
      deploy_mcp_server:
        description: 'Deploy MCP Server'
        required: false
        type: boolean
        default: false
      deploy_mcp_server_oauth:
        description: 'Deploy MCP Server OAuth'
        required: false
        type: boolean
        default: false
      deploy_slack_agent_gateway:
        description: 'Deploy Slack Agent Gateway (SAG)'
        required: false
        type: boolean
        default: false
      deploy_streamlit_server:
        description: 'Deploy Streamlit Server'
        required: false
        type: boolean
        default: false
      deploy_ahs:
        description: 'Deploy Agent Harness Service (VM-based, no Docker)'
        required: false
        type: boolean
        default: false

env:
  IMAGE_BASE: gcr.io/yupp-llms/agent-backend
  BASE_IMAGE: gcr.io/yupp-llms/agent-base-py312:latest
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

permissions:
  contents: write
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  rate-limit-gate:
    runs-on: ubuntu-latest
    # Rate-limits push-triggered runs; manual/scheduled runs always proceed.
    # Must always run (never use `if` to skip) — a skipped job causes GitHub
    # Actions to transitively skip all downstream jobs in the dependency chain.
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check time since last staging deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Manual and scheduled triggers always proceed
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Non-push trigger (${{ github.event_name }}), proceeding."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Find the last successful run of this workflow (excluding the current one)
          LAST_SUCCESS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/deploy-servers-1-build-staging.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].updated_at' 2>/dev/null || echo "")

          if [ -z "$LAST_SUCCESS" ]; then
            echo "No previous successful run found, proceeding."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TS=$(date -d "$LAST_SUCCESS" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_SUCCESS" +%s 2>/dev/null || echo "0")
          NOW_TS=$(date +%s)
          DIFF=$(( NOW_TS - LAST_TS ))
          echo "Last successful deploy: $LAST_SUCCESS ($DIFF seconds ago)"

          if [ "$DIFF" -lt 1200 ]; then
            echo "Last deploy was less than 20 minutes ago. Skipping."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            echo "Last deploy was 20+ minutes ago. Proceeding."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

  print-inputs:
    runs-on: ubuntu-latest
    needs: rate-limit-gate
    if: ${{ needs.rate-limit-gate.outputs.should_deploy == 'true' }}
    steps:
      - name: Print Workflow Inputs
        run: |
          {
            echo "## Deploy Servers 1 - Build & Staging"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Deployment Type | ${{ github.event.inputs.deployment_type || 'normal staging deployment' }} |"
            echo "| Deploy All | ${{ github.event.inputs.deploy_all || 'true' }} |"
            echo "| Deploy MCP Server | ${{ github.event.inputs.deploy_mcp_server || 'false' }} |"
            echo "| Deploy MCP Server OAuth | ${{ github.event.inputs.deploy_mcp_server_oauth || 'false' }} |"
            echo "| Deploy SAG | ${{ github.event.inputs.deploy_slack_agent_gateway || 'false' }} |"
            echo "| Deploy Streamlit Server | ${{ github.event.inputs.deploy_streamlit_server || 'false' }} |"
          } >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    needs: alembic-upgrade-staging
    # Skip build when only AHS is selected (VM-based, no Docker needed). Push events deploy all by default.
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_all == 'true' || github.event.inputs.deploy_mcp_server == 'true' || github.event.inputs.deploy_mcp_server_oauth == 'true' || github.event.inputs.deploy_slack_agent_gateway == 'true' || github.event.inputs.deploy_streamlit_server == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ env.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker gcr.io --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Check if base image needs rebuild
      id: check_base
      run: |
        docker pull ${{ env.BASE_IMAGE }} || { echo "needs_rebuild=true" >> $GITHUB_OUTPUT; exit 0; }
        CONTAINER_ID=$(docker create ${{ env.BASE_IMAGE }})
        docker cp "$CONTAINER_ID:/app/pyproject.toml" /tmp/base_pyproject.toml 2>/dev/null || true
        docker cp "$CONTAINER_ID:/app/poetry.lock" /tmp/base_poetry.lock 2>/dev/null || true
        docker rm "$CONTAINER_ID"

        REBUILD=false
        if ! diff -q pyproject.toml /tmp/base_pyproject.toml > /dev/null 2>&1; then
          echo "pyproject.toml changed - base image rebuild needed"
          REBUILD=true
        fi
        if ! diff -q poetry.lock /tmp/base_poetry.lock > /dev/null 2>&1; then
          echo "poetry.lock changed - base image rebuild needed"
          REBUILD=true
        fi
        echo "needs_rebuild=$REBUILD" >> $GITHUB_OUTPUT

    - name: Build and push base image
      if: steps.check_base.outputs.needs_rebuild == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.base
        platforms: linux/amd64
        push: true
        tags: ${{ env.BASE_IMAGE }}
        cache-from: type=gha,scope=base
        cache-to: type=gha,scope=base,mode=max

    - name: Determine image tags
      id: tags
      run: |
        DEPLOYMENT_TYPE="${{ github.event.inputs.deployment_type || 'normal staging deployment' }}"

        if [ "$DEPLOYMENT_TYPE" = "create staging release candidate" ]; then
          # Tag as both latest and release-candidate
          TAGS="${{ env.IMAGE_BASE }}:latest,${{ env.IMAGE_BASE }}:release-candidate"
          DEPLOY_TAG="release-candidate"
        elif [ "$DEPLOYMENT_TYPE" = "create cherry-pick release candidate" ]; then
          # Only tag as cherry-pick-release-candidate (do NOT update latest)
          TAGS="${{ env.IMAGE_BASE }}:cherry-pick-release-candidate"
          DEPLOY_TAG="cherry-pick-release-candidate"
        else
          # Normal staging: tag as latest only
          TAGS="${{ env.IMAGE_BASE }}:latest"
          DEPLOY_TAG="latest"
        fi

        # Add metadata tags
        TAGS="${TAGS},${{ env.IMAGE_BASE }}:sha-${{ github.sha }},${{ env.IMAGE_BASE }}:run-${{ github.run_id }}"

        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        echo "deploy_tag=${DEPLOY_TAG}" >> $GITHUB_OUTPUT

    - name: Generate build metadata
      run: |
        echo "BUILD_GIT_SHA=${{ github.sha }}" >> .env
        echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env
        echo "BUILD_GIT_BRANCH=${{ github.ref_name }}" >> .env

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=app
        cache-to: type=gha,scope=app,mode=max

    - name: Print image info
      run: |
        {
          echo "## Docker Image Built"
          echo "| Setting | Value |"
          echo "|---------|-------|"
          echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |"
          echo "| Deploy tag | \`${{ steps.tags.outputs.deploy_tag }}\` |"
          echo "| Git SHA | \`${{ github.sha }}\` |"
        } >> $GITHUB_STEP_SUMMARY

    outputs:
      deploy_tag: ${{ steps.tags.outputs.deploy_tag }}


  deploy-staging:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/deploy-servers-2-deploy.yml
    secrets: inherit
    with:
      environment: 'staging'
      image_tag: ${{ needs.build.outputs.deploy_tag }}
      git_sha: ${{ github.sha }}
      deploy_all: ${{ (github.event_name == 'push') || (github.event.inputs.deploy_all == 'true') }}
      deploy_mcp_server: ${{ github.event.inputs.deploy_mcp_server == 'true' }}
      deploy_mcp_server_oauth: ${{ github.event.inputs.deploy_mcp_server_oauth == 'true' }}
      deploy_slack_agent_gateway: ${{ github.event.inputs.deploy_slack_agent_gateway == 'true' }}
      deploy_streamlit_server: ${{ github.event.inputs.deploy_streamlit_server == 'true' }}
      deploy_ahs: ${{ github.event.inputs.deploy_ahs == 'true' }}

  # Run Alembic migrations on staging agentdb before build and deploys.
  alembic-upgrade-staging:
    needs: print-inputs
    uses: ./.github/workflows/apply_alembic_migration.yml
    secrets: inherit
    with:
      environment: 'staging'
      revision_id: 'head'

  # AHS is VM-based (no Docker) — deploy in parallel with build, after alembic migration.
  deploy-ahs-staging:
    runs-on: ubuntu-latest
    needs: alembic-upgrade-staging
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_all == 'true' || github.event.inputs.deploy_ahs == 'true' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        echo "SERVICE_NAME=agent-harness-service" >> $GITHUB_ENV
        echo "GCP_PROJECT_NAME=yupp-llms" >> $GITHUB_ENV
        echo "VM_NAME=agent-harness-service" >> $GITHUB_ENV
        echo "VM_ZONE=us-east5-c" >> $GITHUB_ENV

    - name: Authenticate to Google Cloud
      uses: ./.github/actions/gcp-auth
      with:
        gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Generate .env file
      run: |
        pip install google-cloud-secret-manager PyYAML pydantic
        PYTHONPATH="${GITHUB_WORKSPACE}" python .github/workflows/scripts/generate_vm_env_file.py \
          staging \
          agent-harness-service \
          /tmp/ahs.env

    - name: Deploy to VM
      run: |
        gcloud compute scp /tmp/ahs.env \
          "${{ env.VM_NAME }}:/tmp/ahs.env" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}"

        gcloud compute ssh "${{ env.VM_NAME }}" \
          --zone="${{ env.VM_ZONE }}" \
          --project="${{ env.GCP_PROJECT_NAME }}" \
          --command="sudo cp /tmp/ahs.env /data/ahs/.env && sudo chown ahs:ahs /data/ahs/.env && sudo chmod 600 /data/ahs/.env && rm -f /tmp/ahs.env && cd /opt/yupp-agent && sudo -u ahs git fetch origin && sudo -u ahs git checkout --force ${{ github.sha }} && sudo -u ahs bash -c 'cd /opt/yupp-agent && .venv/bin/pip install \"setuptools<80\" && .venv/bin/poetry lock && .venv/bin/poetry install --no-root' && sudo -u ahs /opt/yupp-agent/ypl/agent_harness_service/deploy/sync_configs.sh --no-pull && sudo systemctl restart ahs && echo 'AHS deployed and restarted successfully'"

    - name: Verify AHS is running
      run: |
        sleep 10
        HEALTH=""
        for i in $(seq 1 6); do
          HEALTH=$(gcloud compute ssh "${{ env.VM_NAME }}" \
            --zone="${{ env.VM_ZONE }}" \
            --project="${{ env.GCP_PROJECT_NAME }}" \
            --command="curl -sf http://localhost:8090/health 2>/dev/null" 2>&1) && break
          echo "Health check attempt $i failed, retrying in 5s..."
          sleep 5
        done
        STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
        echo "AHS health: ${STATUS}"
        if [ "$STATUS" != "ok" ]; then
          echo "::error::AHS health check failed (status: ${STATUS})"
          exit 1
        fi

    - name: Tag commit
      run: |
        git fetch --tags --force
        TAG_NAME=latest-${{ env.SERVICE_NAME }}-staging
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git tag -f $TAG_NAME ${{ github.sha }}
        git push origin $TAG_NAME --force
