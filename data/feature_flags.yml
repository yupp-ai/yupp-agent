# Feature flags — default values for the platform.
#
# How it works (see ypl/backend/feature_flags.py):
#   * Runtime overrides live in Redis and win when present.
#   * Otherwise the `default_state` below is used.
#   * If a flag is absent everywhere, lookups return None / False.
# Read flags with `is_feature_enabled(name)` or `get_feature_value(name)`.
# `critical: true` marks flags that gate important behavior (surfaced in the admin UI).
#
# The entries below are illustrative examples — replace them with your own flags.
feature_flags:
  - name: use_budget_decay
    description: "Example boolean flag: whether agent session budgets decay over time."
    default_state: false
    critical: false
  - name: store_usage_metrics
    description: "Example boolean flag: persist per-session LLM cost/usage metrics to the database."
    default_state: true
    critical: false
  - name: event_flush_batch_size
    description: "Example non-boolean flag: number of buffered events flushed per batch."
    default_state: 100
    critical: false
