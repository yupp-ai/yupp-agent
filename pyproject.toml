[project]
name = "ypl-agent"
description = "Agent infrastructure service for Yupp"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12"


[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports
src = ["ypl"]

exclude = [
    ".git/",
    "ypl/db/alembic/versions/*",
    "tmp/",
]

line-length = 120
indent-width = 4

[tool.ruff.lint.per-file-ignores]
# ignore star and unused imports
"__init__.py" = ["F403", "F405"]

[tool.ruff.lint]
select = [
    # flake8-bugbear (bug-prone patterns and design issues)
    "B",
    # flake8-comprehensions (better comprehensions)
    "C4",
    # pycodestyle error
    "E",
    # pyflakes
    "F",
    # refurb (modernize Python code)
    "FURB",
    # isort
    "I",
    # perflint (performance anti-patterns)
    "PERF",
    # flake8-pie (misc - duplicate calls, etc)
    "PIE",
    # flake8-return (simplify return statements)
    "RET",
    # flake8-simplify (code simplification)
    "SIM11",
    # flake8-tidy-imports
    "TID",
    # pyupgrade
    "UP",
    # pycodestyle warning
    "W",
    # misuse of noqa
    "RUF1",
    # dates without tz
    "DTZ",
]

ignore = []

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.select" = {msg = "Please use SQLModel.select instead of SQLAlchemy's select"}
"sqlalchemy.ext.asyncio.session.AsyncSession" = {msg = "Please use SQLModel.AsyncSession instead of SQLAlchemy's AsyncSession"}


[tool.poetry]
name = "ypl-agent"
version = "0.0.1"
description = "Agent infrastructure service for Yupp"
license = "Proprietary"
authors = [
    "Yupp Eng <eng@yupp.ai>",
]
readme = "README.md"
packages = [{include = "ypl"}]

[tool.poetry.dependencies]
# Core
python = ">=3.12.12,<3.13"
pydantic = {version = "2.11.10", extras = ["email"]}
pydantic-settings = "2.10.1"
python-dotenv = "^1.2.1"

# Database
alembic = "^1.17.2"
asyncpg = "0.31.0"
pgvector = "0.2.5"
psycopg2-binary = "2.9.11"
sqlalchemy = {version = "2.0.44", extras = ["asyncio"]}
sqlmodel = "0.0.27"
cloud-sql-python-connector = {version = "^1.20", extras = ["asyncpg"]}

# Web framework
fastapi = "0.122.0"
uvicorn = {version = "0.40.0", extras = ["standard"]}
uvloop = "0.22.1"
orjson = "^3.11.5"
python-multipart = "^0.0.20"
httpx = "0.28.1"
aiohttp = "3.11.16"
requests = "^2.32.5"

# MCP
fastmcp = "^2.14.4"

# Logging & Observability
structlog = "^24.2.0"
google-cloud-logging = "^3.13.0"
google-cloud-monitoring = "2.28.0"
google-cloud-trace = "1.17.0"
opentelemetry-exporter-gcp-trace = "1.11.0"
opentelemetry-instrumentation-fastapi = "0.60b0"
opentelemetry-instrumentation-sqlalchemy = "0.60b0"
google-cloud-sqlcommenter = { version = "2.0.0", extras = ["opentelemetry"] }

# GCP
google-auth = "2.45.0"
google-cloud-secret-manager = "2.25.0"
google-cloud-bigquery = {version = "^3.39.0", extras = ["pandas"]}
gcloud-aio-storage = "9.6.1"

# Redis
redis = "5.3.1"
upstash-redis = "1.5.0"

# Slack
slack-bolt = "^1.27.0"
slack-sdk = "^3.39.0"

# Jobs
taskiq = "0.12.1"
taskiq-redis = "1.0.9"
croniter = "^6.0.0"

# Email
resend = "^2.5.1"

# Encryption
PyNaCl = "^1.5.0"
cryptography = ">=43.0.0"

# LLM providers
anthropic = ">=0.49.0"
# Claude Agent SDK — in-process runner for AHS executor v2 (Section 3.2 of design doc).
# Declared as a dependency so the package is available at runtime; the runner
# implementation uses the ``anthropic`` SDK directly for its well-known API.
claude-agent-sdk = ">=0.0.1"
langchain-core = ">=0.3.0"
openai = ">=1.30.0"
tiktoken = ">=0.7.0"

# Utilities
bcrypt = "^4.0"
cachetools = "5.5.2"
numpy = ">=1.26"
psutil = "^7.0.0"
rich = ">=13.0"
setuptools = "<80"
tenacity = "8.5.0"
PyYAML = ">=6.0"
textual = ">=0.40"
google-api-python-client = "^2.193.0"
cloudpathlib = "^0.23.0"
streamlit = "^1.55.0"
plotly = "^6.1.0"
google-cloud-storage = "^3.1.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.0"
pytest = "^8.3.3"
pytest-alembic = "^0.11.1"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
ruff = "^0.14.9"
pytest-timeout = "^2.4.0"
types-requests = "^2.33.0.20260327"
types-pyyaml = "^6.0.12.20250915"
types-cachetools = "^6.2.0.20260317"
pytest-cov = "^7.1.0"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["ypl/db/alembic/", "tmp/", "scripts/"]
cache_dir = ".mypy_cache"
incremental = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:importlib.*:",
    "ignore:Using extra keyword arguments on `Field` is deprecated:DeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ypl"]
omit = [
    "ypl/db/alembic/*",
    "ypl/streamlit_server/*",
    "ypl/agent_harness_service/deploy/*",
    "ypl/agent_harness_service/tui/*",
    "ypl/agent_harness_service/scripts/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70  # Ratchet target: 33 → 80%. See http://go/p/55313dc9-bed8-49cf-ace2-ab7d37240dbb

[tool.uv.workspace]
members = [
    "example",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
