[project]
name = "ahs-memory"
version = "0.1.0"
description = "CLI for bulk-importing a local Markdown workspace into AHS as scope=user MEMORY artifacts."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.9",
]

[project.scripts]
ahs-memory = "ahs_memory.cli:main"

[tool.ruff]
line-length = 120
src = ["ahs_memory", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "FURB", "I", "PERF", "PIE", "RET", "SIM", "TID", "UP", "W", "RUF", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
packages = ["ahs_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ahs_memory*"]
