# Permissions configuration for the Streamlit server ("Lit" console).
#
# Each permission maps to the set of user emails granted that permission.
# Login is gated separately (see ypl/streamlit_server/auth.py); this file
# controls *action-level* authorization on top of that login check.
#
# Deployers should populate the email lists below with addresses from their
# ALLOWED_EMAIL_DOMAINS. The file ships empty so a fresh install does not
# expose the Agent Harness Console to anyone by default.

permissions:
  # Required for viewing the Agent Harness Console and all agent sessions/projects/schedules.
  AGENT_HARNESS_ADMIN:
    emails: []
