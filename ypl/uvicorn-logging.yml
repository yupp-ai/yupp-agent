version: 1
formatters:
  access:
    (): 'uvicorn.logging.AccessFormatter'
    format: '%(levelname)-8s - [PID:%(process)d] - %(client_addr)s - "%(request_line)s" %(status_code)s'
    use_colors: false
handlers:
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
